name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events.
  push: {}
  pull_request: {}
  schedule:
    # Run daily to catch breakages in new Rust versions as well as new cargo audit findings.
    - cron: '0 16 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.rust_os.os }}

    strategy:
      fail-fast: false
      matrix:
        rust_os:
          - { rust: 1.85.0, os: ubuntu-22.04 }
          - { rust: stable, os: ubuntu-latest }
          - { rust: beta, os: ubuntu-latest }
          - { rust: nightly, os: ubuntu-latest }

    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        env:
          RUST_TOOLCHAIN: ${{ matrix.rust_os.rust }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup override set "$RUST_TOOLCHAIN"

      # Newer dependency versions may not support the MSRV, so we use a Cargo.lock file for those
      # builds.
      - name: Use Rust 1.85 lockfile
        if: ${{ matrix.rust_os.rust == '1.85.0' }}
        run: |
          cp Cargo-1.85.lock Cargo.lock
          echo "CARGO_LOCKED=--locked" >> "$GITHUB_ENV"

      - name: Run tests
        run: cargo ${CARGO_LOCKED:+"$CARGO_LOCKED"} test --tests --examples
      - name: Doc tests
        run: |
          cargo ${CARGO_LOCKED:+"$CARGO_LOCKED"} test --doc
          cargo ${CARGO_LOCKED:+"$CARGO_LOCKED"} test --doc --no-default-features
          cargo ${CARGO_LOCKED:+"$CARGO_LOCKED"} test --doc --all-features
      - name: Test with all features enabled
        run: cargo ${CARGO_LOCKED:+"$CARGO_LOCKED"} test --all-features
      # Curl without reqwest (examples will not build)
      - name: Test with curl (w/o reqwest)
        run: cargo ${CARGO_LOCKED:+"$CARGO_LOCKED"} test --tests --features curl --no-default-features

      - name: Check fmt
        if: ${{ matrix.rust_os.rust == '1.85.0' }}
        run: cargo ${CARGO_LOCKED:+"$CARGO_LOCKED"} fmt --all -- --check

      - name: Clippy
        if: ${{ matrix.rust_os.rust == '1.85.0' }}
        run: cargo ${CARGO_LOCKED:+"$CARGO_LOCKED"} clippy --all --all-features -- --deny warnings

      - name: Check WASM build
        run: cargo ${CARGO_LOCKED:+"$CARGO_LOCKED"} check --target wasm32-unknown-unknown

  audit:
    name: Audit (${{ matrix.lockfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lockfile: [Cargo.lock, Cargo-1.85.lock]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install audit toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Resolve latest dependencies
        if: ${{ matrix.lockfile == 'Cargo.lock' }}
        run: cargo generate-lockfile

      - name: Audit dependencies
        env:
          AUDIT_LOCKFILE: ${{ matrix.lockfile }}
        run: cargo audit --file "$AUDIT_LOCKFILE"
